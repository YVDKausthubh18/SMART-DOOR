<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Doorbell System</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/face-api.js/1.3.0/face-api.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
            margin: auto;
            max-width: 500px;
        }
        video, canvas, img {
            width: 100%;
            border-radius: 10px;
            border: 3px solid #ff6f61;
            margin-bottom: 10px;
        }
        button {
            background: #ff6f61;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background: #d64541;
        }
        #capturedImage {
            display: none;
        }
        #loading {
            color: white;
            font-size: 18px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>🚪 AI-Powered Smart Doorbell</h1>
    <p id="loading">⏳ Loading AI Model... Please wait</p>

    <div class="container">
        <video id="video" autoplay></video>
        <canvas id="canvas" style="display: none;"></canvas>
        <img id="capturedImage" alt="Captured Photo">
        <button onclick="capturePhoto()">📸 Capture & Send</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const capturedImage = document.getElementById('capturedImage');
        const loadingText = document.getElementById('loading');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Camera access error: ", err);
            }
        }

        async function loadFaceAI() {
            loadingText.style.display = 'block';
            await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js@1.3.0/models/');
            loadingText.style.display = 'none';
        }

        async function detectFaces() {
            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
            return detections.length > 0;
        }

        async function capturePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (await detectFaces()) {
                const imageUrl = canvas.toDataURL('image/png');
                capturedImage.src = imageUrl;
                capturedImage.style.display = 'block';

                // Send image to backend (Modify API URL)
                fetch('https://your-backend-api.com/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageUrl })
                })
                .then(response => response.json())
                .then(data => alert("📨 Photo sent to Admin!"))
                .catch(error => console.error('Error:', error));
            } else {
                alert("❌ No face detected! Try again.");
            }
        }

        window.onload = () => {
            startCamera();
            loadFaceAI();
        };
    </script>

</body>
</html>
